<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e74c3c">
    <title>Finance Tracker</title>
    <script>
        // Apply the saved theme before first paint to avoid a flash. The theme
        // preference is stored separately from expense data.
        (function () {
            try {
                var t = localStorage.getItem('financeTracker_theme');
                t = (t === 'light' || t === 'dark') ? t : 'dark';
            } catch (e) {
                t = 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', t === 'dark' ? '#1b1e25' : '#e74c3c');
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Finance Tracker</h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">☀️</button>
            <nav>
                <button class="nav-btn active" data-page="add">Add Expense</button>
                <button class="nav-btn" data-page="list">View Transactions</button>
                <button class="nav-btn" data-page="dashboard">Dashboard</button>
            </nav>
        </header>

        <main>
            <!-- Add Expense Form -->
            <div id="add-page" class="page active">
                <div class="form-container">
                    <h2>Add New Expense</h2>
                    <form id="expense-form">
                        <div class="form-group">
                            <label for="amount">Amount Spent *</label>
                            <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="payment-mode">Payment Mode</label>
                            <select id="payment-mode" name="paymentMode">
                                <option value="">Select payment mode</option>
                                <option value="cash">Cash</option>
                                <option value="card">Card</option>
                                <option value="upi">UPI</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group" id="payment-comment-group" style="display: none;">
                            <label>Payment Method Details</label>

                            <!-- Card options -->
                            <div id="card-options" class="payment-options" style="display:none;">
                                <label class="radio-option"><input type="radio" name="cardOption" value="Axis Flipkart"> Axis Flipkart</label>
                                <label class="radio-option"><input type="radio" name="cardOption" value="Axis Neo"> Axis Neo</label>
                                <label class="radio-option"><input type="radio" name="cardOption" value="HDFC Swiggy"> HDFC Swiggy</label>
                                <label class="radio-option"><input type="radio" name="cardOption" value="Indusind Cred"> Indusind Cred</label>
                                <label class="radio-option"><input type="radio" name="cardOption" value="HSBC Platinum"> HSBC Platinum</label>
                                <label class="radio-option"><input type="radio" name="cardOption" value="__other__"> Other</label>
                                <input type="text" id="card-other-text" class="payment-other-text" placeholder="Specify your card" style="display:none;">
                            </div>

                            <!-- UPI options -->
                            <div id="upi-options" class="payment-options" style="display:none;">
                                <label class="radio-option"><input type="radio" name="upiOption" value="UPI Lite"> UPI Lite</label>
                                <label class="radio-option"><input type="radio" name="upiOption" value="Cred UPI"> Cred UPI</label>
                                <label class="radio-option"><input type="radio" name="upiOption" value="Indusind Cred Rupay UPI"> Indusind Cred Rupay UPI</label>
                                <label class="radio-option"><input type="radio" name="upiOption" value="Axis Neo Rupay UPI"> Axis Neo Rupay UPI</label>
                                <label class="radio-option"><input type="radio" name="upiOption" value="__other__"> Other</label>
                                <input type="text" id="upi-other-text" class="payment-other-text" placeholder="Specify your UPI app" style="display:none;">
                            </div>

                            <!-- Other payment mode free text -->
                            <div id="other-options" class="payment-options" style="display:none;">
                                <input type="text" id="other-payment-text" placeholder="e.g., Bank transfer, Cheque, etc.">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value="">Select category</option>
                                <option value="food">Food Order</option>
                                <option value="grocery">Grocery</option>
                                <option value="shopping">Shopping</option>
                                <option value="restaurant">Restaurant</option>
                                <option value="travel">Travel</option>
                                <option value="others">Others</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date">
                        </div>

                        <div class="form-group">
                            <label for="remarks">Remarks</label>
                            <textarea id="remarks" name="remarks" placeholder="Add any comments about this expense..."></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Add Expense</button>
                    </form>
                </div>
            </div>

            <!-- Transactions List -->
            <div id="list-page" class="page">
                <div class="transactions-container">
                    <div class="transactions-header">
                        <h2>Transaction History</h2>
                        <div class="summary-cards">
                            <div class="summary-card">
                                <span class="summary-label">Total Spent</span>
                                <span class="summary-value" id="total-spent">₹0</span>
                            </div>
                            <div class="summary-card">
                                <span class="summary-label">This Month</span>
                                <span class="summary-value" id="month-spent">₹0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="filters-container">
                        <div class="filter-row">
                            <select id="filter-payment" class="filter-select">
                                <option value="">All Payment Modes</option>
                                <option value="cash">Cash</option>
                                <option value="card">Card</option>
                                <option value="upi">UPI</option>
                                <option value="other">Other</option>
                            </select>
                            <select id="filter-category" class="filter-select">
                                <option value="">All Categories</option>
                                <option value="food">Food Order</option>
                                <option value="grocery">Grocery</option>
                                <option value="shopping">Shopping</option>
                                <option value="restaurant">Restaurant</option>
                                <option value="travel">Travel</option>
                                <option value="others">Others</option>
                            </select>
                        </div>
                        <div class="filter-row">
                            <input type="date" id="filter-date-from" class="filter-input" placeholder="From Date">
                            <input type="date" id="filter-date-to" class="filter-input" placeholder="To Date">
                        </div>
                        <button id="clear-filters" class="clear-filters-btn">Clear Filters</button>
                    </div>

                    <!-- Transaction List -->
                    <div class="transactions-list" id="transactions-list">
                        <div class="no-transactions" id="no-transactions">
                            <p>No transactions found</p>
                            <button class="nav-btn" onclick="showAddPage()">Add Your First Expense</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashboard (placeholder) -->
            <div id="dashboard-page" class="page">
                <h2>Dashboard</h2>
                <p>Coming soon...</p>
            </div>
        </main>
    </div>

    <div id="notification" class="notification"></div>
    <script src="script.js"></script>
</body>
</html>
